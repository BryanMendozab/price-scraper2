# Blueprint de Render: un solo Web Service sirve frontend (dist/) + API + scheduler.
# Plan FREE para la demo: sin disco persistente (db.json/history.json viven
# en disco efimero y se pierden en cada reinicio o deploy) y se duerme a los
# 15 min sin trafico. Mantener una pestana abierta (el dashboard consulta
# cada 5s) evita que se duerma durante la presentacion.
#
# Correo (cuando tengas las credenciales): NO van en este archivo.
# Agrégalas en el dashboard: servicio > Environment > Add Environment Variable
#   SMTP_HOST=smtp.gmail.com, SMTP_PORT=587, SMTP_SECURE=false,
#   SMTP_USER=<tu gmail>, SMTP_PASS=<app password>, SMTP_FROM=<tu gmail>
# Guardar reinicia el servicio y el digest empieza a salir solo. Sin esas
# variables la app funciona igual, solo omite los envios.
services:
  - type: web
    name: price-scraper
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: CRAWL_INTERVAL_SECONDS
        value: 60
